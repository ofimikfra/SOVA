<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOVA Dashboard</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f0f0f;
      --surface:     #1a1a1a;
      --surface2:    #242424;
      --border:      #2e2e2e;
      --text:        #f0f0f0;
      --text-muted:  #888;
      --accent:      #00C853;
      --accent-dim:  #00843a;
      --warn:        #FF6B35;
      --negative:    #ef5350;
      --positive:    #00C853;
      --neutral:     #888;
      --focus:       #4fc3f7;
      --radius:      12px;
      --font:        "Inter", "Segoe UI", system-ui, sans-serif;
    }

    html { font-size: 16px; }

    body {
      background:  var(--bg);
      color:       var(--text);
      font-family: var(--font);
      min-height:  100vh;
      display:     flex;
      flex-direction: column;
      align-items: center;
      padding:     32px 16px;
      gap:         24px;
    }

    /* ── Focus visible for keyboard nav ── */
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ── Skip link for screen readers ── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 16px;
      background: var(--focus);
      color: #000;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      z-index: 999;
    }
    .skip-link:focus { top: 16px; }

    /* ── Layout ── */
    .page { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 20px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .logo-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── Status pill ── */
    #status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      transition: border-color 0.3s, background 0.3s;
    }
    #status-pill[data-status="connected"] {
      border-color: var(--accent);
      background: rgba(0, 200, 83, 0.08);
    }
    #status-pill[data-status="disconnected"] {
      border-color: var(--warn);
      background: rgba(255, 107, 53, 0.08);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    [data-status="connected"]    .status-dot { background: var(--accent); }
    [data-status="disconnected"] .status-dot { background: var(--warn); }

    /* ── Cards ── */
    .card {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--radius);
      padding:       24px;
    }

    .card-title {
      font-size:     0.72rem;
      font-weight:   700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color:         var(--text-muted);
      margin-bottom: 16px;
    }

    /* ── Description feed ── */
    #description-text {
      font-size:   1.25rem;
      line-height: 1.6;
      color:       var(--text);
      min-height:  2em;
    }

    #description-text.placeholder {
      color: var(--text-muted);
      font-style: italic;
    }

    #description-conf {
      margin-top:  10px;
      font-size:   0.82rem;
      color:       var(--text-muted);
      display:     flex;
      align-items: center;
      gap:         8px;
    }

    .conf-bar-track {
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
    }
    .conf-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.5s ease;
      width: 0%;
    }

    /* ── Feed history ── */
    #feed {
      display:        flex;
      flex-direction: column;
      gap:            10px;
      max-height:     260px;
      overflow-y:     auto;
      padding-right:  4px;
    }

    #feed::-webkit-scrollbar       { width: 4px; }
    #feed::-webkit-scrollbar-track { background: transparent; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .feed-item {
      display:       flex;
      gap:           12px;
      padding:       12px 14px;
      border-radius: 8px;
      background:    var(--surface2);
      border-left:   3px solid transparent;
      animation:     fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    .feed-item[data-sentiment="positive"] { border-left-color: var(--positive); }
    .feed-item[data-sentiment="negative"] { border-left-color: var(--negative); }
    .feed-item[data-sentiment="neutral"]  { border-left-color: var(--neutral);  }

    .feed-time {
      font-size:  0.75rem;
      color:      var(--text-muted);
      white-space: nowrap;
      padding-top: 2px;
      min-width:  42px;
    }

    .feed-text {
      font-size:   0.92rem;
      line-height: 1.5;
      color:       var(--text);
    }

    /* ── Settings ── */
    .settings-grid {
      display:   flex;
      flex-direction: column;
      gap:       20px;
    }

    .setting-row {
      display:     flex;
      align-items: center;
      justify-content: space-between;
      gap:         16px;
    }

    .setting-label {
      display:     flex;
      flex-direction: column;
      gap:         3px;
    }

    .setting-label strong {
      font-size: 0.95rem;
      color:     var(--text);
    }

    .setting-label span {
      font-size: 0.8rem;
      color:     var(--text-muted);
    }

    /* Toggle switch */
    .toggle {
      position:   relative;
      width:      48px;
      height:     26px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity:  0;
      width:    0;
      height:   0;
      position: absolute;
    }
    .toggle-track {
      position:      absolute;
      inset:         0;
      background:    var(--surface2);
      border-radius: 999px;
      border:        1.5px solid var(--border);
      cursor:        pointer;
      transition:    background 0.2s, border-color 0.2s;
    }
    .toggle-track::after {
      content:       "";
      position:      absolute;
      top:           3px;
      left:          3px;
      width:         16px;
      height:        16px;
      background:    var(--text-muted);
      border-radius: 50%;
      transition:    transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .toggle-track {
      background:    rgba(0, 200, 83, 0.15);
      border-color:  var(--accent);
    }
    .toggle input:checked + .toggle-track::after {
      transform:  translateX(22px);
      background: var(--accent);
    }
    .toggle input:focus-visible + .toggle-track {
      outline:        3px solid var(--focus);
      outline-offset: 3px;
    }

    /* Select & range */
    select, input[type="range"] {
      background:    var(--surface2);
      border:        1.5px solid var(--border);
      color:         var(--text);
      border-radius: 8px;
      padding:       7px 10px;
      font-size:     0.9rem;
      cursor:        pointer;
      transition:    border-color 0.2s;
    }
    select:hover, select:focus-visible { border-color: var(--focus); }
    select { min-width: 180px; }

    input[type="range"] {
      padding:    0;
      width:      130px;
      height:     6px;
      accent-color: var(--accent);
      border:     none;
    }

    .range-row {
      display:     flex;
      align-items: center;
      gap:         10px;
    }
    .range-value {
      font-size:  0.85rem;
      color:      var(--text);
      min-width:  40px;
      text-align: right;
    }

    /* Save button */
    #save-btn {
      margin-top:    8px;
      padding:       10px 24px;
      background:    var(--accent);
      color:         #000;
      font-weight:   700;
      font-size:     0.9rem;
      border:        none;
      border-radius: 8px;
      cursor:        pointer;
      align-self:    flex-end;
      transition:    background 0.2s, transform 0.1s;
    }
    #save-btn:hover  { background: #00e676; }
    #save-btn:active { transform: scale(0.97); }
    #save-btn:disabled {
      background: var(--surface2);
      color:      var(--text-muted);
      cursor:     not-allowed;
    }

    #save-status {
      font-size:  0.8rem;
      color:      var(--accent);
      min-height: 1.2em;
      text-align: right;
    }

    /* ── Live region for screen readers ── */
    #sr-live {
      position:   absolute;
      width:      1px;
      height:     1px;
      overflow:   hidden;
      clip:       rect(0,0,0,0);
      white-space: nowrap;
    }

    #start-btn {
      padding:       8px 20px;
      border:        none;
      border-radius: 8px;
      font-weight:   700;
      font-size:     0.85rem;
      cursor:        pointer;
      transition:    background 0.2s, transform 0.1s;
      background:    var(--accent);
      color:         #000;
    }
    #start-btn:hover  { background: #00e676; }
    #start-btn:active { transform: scale(0.97); }
    #start-btn[data-running="true"] {
      background: var(--warn);
      color:      #fff;
    }
  </style>
</head>

<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Screen reader live region — announces new descriptions automatically -->
  <div id="sr-live" aria-live="polite" aria-atomic="true" role="status"></div>

  <div class="page" id="main">

    <!-- Header -->
    <header>
      <div class="logo" role="banner">
        <div class="logo-dot" aria-hidden="true"></div>
        SOVA
      </div>
    
      <div style="display:flex; align-items:center; gap:10px;">
        <!-- Start / Stop button — only shown when running as desktop app -->
        <button id="start-btn"
                aria-label="Start SOVA engine"
                style="display:none">
          Start
        </button>
      
        <div id="status-pill"
             role="status"
             aria-label="Connection status: disconnected"
             data-status="disconnected">
          <div class="status-dot" aria-hidden="true"></div>
          <span id="status-text">Not connected</span>
        </div>
      </div>
    </header>

    <!-- Latest Description -->
    <section class="card" aria-labelledby="desc-heading">
      <div class="card-title" id="desc-heading">Latest Description</div>
      <p id="description-text"
         class="placeholder"
         aria-label="Latest SOVA description">
        Waiting for SOVA...
      </p>
      <div id="description-conf" aria-label="Confidence level">
        <span id="conf-label">—</span>
        <div class="conf-bar-track" role="progressbar"
             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
             aria-label="Confidence">
          <div class="conf-bar-fill" id="conf-bar"></div>
        </div>
        <span id="conf-pct"></span>
      </div>
    </section>

    <!-- Feed -->
    <section class="card" aria-labelledby="feed-heading">
      <div class="card-title" id="feed-heading">Description Feed</div>
      <ol id="feed" aria-label="History of SOVA descriptions" aria-live="polite">
        <!-- Feed items injected by JS -->
      </ol>
    </section>

    <!-- Settings -->
    <section class="card" aria-labelledby="settings-heading">
      <div class="card-title" id="settings-heading">Settings</div>
      <div class="settings-grid">

        <!-- TTS toggle -->
        <div class="setting-row">
          <div class="setting-label">
            <strong>Text-to-Speech</strong>
            <span>Speak descriptions aloud</span>
          </div>
          <label class="toggle" aria-label="Text-to-speech toggle">
            <input type="checkbox" id="tts-toggle" checked>
            <div class="toggle-track"></div>
          </label>
        </div>

        <!-- Flush interval -->
        <div class="setting-row">
          <div class="setting-label">
            <strong>Analysis Interval</strong>
            <span>How often SOVA analyses</span>
          </div>
          <div class="range-row">
            <input type="range" id="flush-interval"
                   min="3" max="30" step="1" value="5"
                   aria-label="Analysis interval in seconds"
                   aria-valuemin="3" aria-valuemax="30" aria-valuenow="5">
            <span class="range-value" id="interval-display"
                  aria-live="polite" aria-atomic="true">5s</span>
          </div>
        </div>

        <!-- Ollama model -->
        <div class="setting-row">
          <div class="setting-label">
            <strong>Ollama Model</strong>
            <span>Local LLM for descriptions</span>
          </div>
          <select id="ollama-model" aria-label="Select Ollama model">
            <option value="llama3.2:3b">llama3.2:3b (recommended)</option>
            <option value="llama3.2:1b">llama3.2:1b (fastest)</option>
            <option value="mistral">mistral (balanced)</option>
            <option value="llama3:8b">llama3:8b (best quality)</option>
          </select>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
          <button id="save-btn" aria-label="Save settings">Save Settings</button>
          <span id="save-status" aria-live="polite" aria-atomic="true"></span>
        </div>

      </div>
    </section>

  </div><!-- /.page -->

  <script>
    // ── Config ────────────────────────────────────────────────────────────
    const WS_URL            = "ws://localhost:8765";
    const RECONNECT_DELAY   = 3000;
    const MAX_FEED_ITEMS    = 20;

    // ── State ─────────────────────────────────────────────────────────────
    let socket        = null;
    let latestSentiment = "neutral";
    let latestConf      = 0;

    // ── DOM refs ──────────────────────────────────────────────────────────
    const statusPill    = document.getElementById("status-pill");
    const statusText    = document.getElementById("status-text");
    const descText      = document.getElementById("description-text");
    const confLabel     = document.getElementById("conf-label");
    const confBar       = document.getElementById("conf-bar");
    const confPct       = document.getElementById("conf-pct");
    const confTrack     = confBar.parentElement;
    const feed          = document.getElementById("feed");
    const srLive        = document.getElementById("sr-live");

    const ttsToggle     = document.getElementById("tts-toggle");
    const flushSlider   = document.getElementById("flush-interval");
    const intervalDisp  = document.getElementById("interval-display");
    const modelSelect   = document.getElementById("ollama-model");
    const saveBtn       = document.getElementById("save-btn");
    const saveStatus    = document.getElementById("save-status");

    // ── Desktop app bridge ────────────────────────────────────────────────────
    // window.pywebview is only defined when running inside the PyWebView app.
    // When opened directly in a browser (extension context) it's undefined
    // and the Start button stays hidden — so the same file works in both contexts.

    const startBtn = document.getElementById("start-btn");
    let engineRunning = false;

    async function initDesktopApp() {
      if (typeof window.pywebview === "undefined") return;
    
      // Show the start button — we're inside the desktop app
      startBtn.style.display = "block";
    
      // Sync initial state
      const status = await window.pywebview.api.get_status();
      setEngineState(status.running);
    }

    function setEngineState(running) {
      engineRunning = running;
      startBtn.textContent          = running ? "Stop SOVA" : "Start SOVA";
      startBtn.ariaLabel            = running ? "Stop SOVA engine" : "Start SOVA engine";
      startBtn.dataset.running      = running;
    }

    startBtn.addEventListener("click", async () => {
      if (typeof window.pywebview === "undefined") return;
    
      if (!engineRunning) {
        const result = await window.pywebview.api.start();
        if (result.ok) setEngineState(true);
      } else {
        const result = await window.pywebview.api.stop();
        if (result.ok) setEngineState(false);
      }
    });

    // Wait for pywebview to be ready before calling the API
    window.addEventListener("pywebviewready", initDesktopApp);
    // Fallback — pywebviewready sometimes fires before listener attached
    if (typeof window.pywebview !== "undefined") initDesktopApp();

    // ── WebSocket ─────────────────────────────────────────────────────────
    function connect() {
      socket = new WebSocket(WS_URL);

      socket.addEventListener("open", () => {
        setStatus("connected");
        // Request current config on connect
        socket.send(JSON.stringify({ type: "get_config" }));
      });

      socket.addEventListener("message", (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "result")  handleResult(msg);
          if (msg.type === "config")  applyConfig(msg);
        } catch (_) {}
      });

      socket.addEventListener("close", () => {
        setStatus("disconnected");
        setTimeout(connect, RECONNECT_DELAY);
      });

      socket.addEventListener("error", () => socket.close());
    }

    // ── Status ────────────────────────────────────────────────────────────
    function setStatus(s) {
      statusPill.dataset.status    = s;
      statusPill.ariaLabel         = `Connection status: ${s}`;
      statusText.textContent       = s === "connected" ? "Connected" : "Not connected";
    }

    // ── Handle result from SOVA ───────────────────────────────────────────
    function handleResult(msg) {
      const summary  = msg.summary  ?? "No description available.";
      const conf     = msg.sentimentConf ?? 0;
      const sentiment= msg.sentiment ?? "neutral";

      latestSentiment = sentiment;
      latestConf      = conf;

      // Update latest description card
      descText.textContent = summary;
      descText.classList.remove("placeholder");

      // Confidence bar
      const pct = Math.round(conf * 100);
      confBar.style.width            = pct + "%";
      confTrack.setAttribute("aria-valuenow", pct);
      confPct.textContent            = pct + "%";
      confLabel.textContent          = confTier(conf);

      // Announce to screen readers
      srLive.textContent = summary;

      // Add to feed
      addFeedItem(summary, sentiment, conf);
    }

    function confTier(conf) {
      if (conf < 0.65) return "Low confidence";
      if (conf < 0.85) return "Medium confidence";
      return "High confidence";
    }

    // ── Feed ──────────────────────────────────────────────────────────────
    function addFeedItem(text, sentiment, conf) {
      const now  = new Date();
      const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      const li = document.createElement("li");
      li.className = "feed-item";
      li.dataset.sentiment = sentiment;
      li.innerHTML = `
        <span class="feed-time" aria-label="Time: ${time}">${time}</span>
        <span class="feed-text">${escapeHtml(text)}</span>
      `;

      feed.prepend(li);

      // Trim old items
      while (feed.children.length > MAX_FEED_ITEMS) {
        feed.removeChild(feed.lastChild);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // ── Settings ──────────────────────────────────────────────────────────
    flushSlider.addEventListener("input", () => {
      intervalDisp.textContent        = flushSlider.value + "s";
      flushSlider.ariaValueNow        = flushSlider.value;
    });

    function applyConfig(cfg) {
      if (cfg.tts_enabled    !== undefined) ttsToggle.checked  = cfg.tts_enabled;
      if (cfg.flush_interval !== undefined) {
        flushSlider.value              = cfg.flush_interval;
        intervalDisp.textContent       = cfg.flush_interval + "s";
      }
      if (cfg.ollama_model   !== undefined) modelSelect.value  = cfg.ollama_model;
    }

    function loadLocalSettings() {
      // Fall back to chrome.storage if available (extension context),
      // otherwise use localStorage for dev/file:// context
      const store = (typeof chrome !== "undefined" && chrome.storage)
        ? null   // handled via WS get_config
        : null;

      const raw = localStorage.getItem("sova_config");
      if (raw) {
        try { applyConfig(JSON.parse(raw)); } catch(_) {}
      }
    }

    saveBtn.addEventListener("click", () => {
      const settings = {
        type:           "settings",
        tts_enabled:    ttsToggle.checked,
        flush_interval: parseInt(flushSlider.value, 10),
        ollama_model:   modelSelect.value,
      };

      // Save locally
      localStorage.setItem("sova_config", JSON.stringify(settings));

      // Send to local app if connected
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(settings));
        showSaveStatus("✓ Saved and applied");
      } else {
        showSaveStatus("✓ Saved locally — SOVA not connected");
      }
    });

    function showSaveStatus(msg) {
      saveStatus.textContent = msg;
      setTimeout(() => { saveStatus.textContent = ""; }, 3000);
    }

    // ── Boot ──────────────────────────────────────────────────────────────
    loadLocalSettings();
    connect();
  </script>
</body>
</html>
