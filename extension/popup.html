<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOVA</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="logo">
      <img src="logo.png" alt="SOVA logo">
      SOVA
    </span>
    <span id="status" class="status" role="status" aria-live="polite">Not connected</span>
  </div>

  <div id="latest"
       class="latest"
       aria-label="Latest description"
       aria-live="polite">
    Waiting for SOVA...
  </div>

  <!-- TTS volume -->
  <div class="volume-row">
    <span class="vol-label">🔈</span>
    <input type="range" id="tts-volume"
           min="0" max="1" step="0.05" value="0.25"
           aria-label="TTS volume">
    <span class="vol-value" id="vol-display">25%</span>
  </div>

  <button id="open-dash" aria-label="Open SOVA dashboard">
    Open Dashboard
  </button>

  <script src="popup.js"></script>
</body>
</html>
