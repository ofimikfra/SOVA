<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOVA</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="dot" id="dot" aria-hidden="true"></div>
    <span class="logo">SOVA</span>
    <span id="status" class="status" role="status" aria-live="polite">Not connected</span>
  </div>

  <div id="latest"
       class="latest"
       aria-label="Latest description"
       aria-live="polite">
    Waiting for SOVA...
  </div>

  <button id="start-btn" aria-label="Start SOVA" disabled>
    Open SOVA app first
  </button>

  <script src="popup.js"></script>
</body>
</html>
