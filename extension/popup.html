<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>SOVA</title>
</head>
<body>
    <script src="popup.js"></script>

    <div class="menu-container">
        <img src="logo.png" alt="Sova Logo"  class="logo">

        <h1>SOVA</h1>

        <div class="button-stack">
            <button class="btn">Start Call Assistance</button>
            <button class="btn">Language Options</button>
            <button class="btn">Settings</button>
            <button class="btn">Tutorial</button>
        </div>
    </div>
    <div class="volume-container">
        <label>Voice Volume</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8">
    </div>
    <div class="button-group">
        <button id="start-btn" class="btn primary">Start SOVA</button>
        <button id="toggle-btn" class="btn secondary">Toggle Dashboard</button>
    </div>
</body>
</html>
