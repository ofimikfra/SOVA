<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SOVA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="brand-section">
      <img src="logo.png" alt="SOVA Logo" class="logo">
      <h1>SOVA</h1>
    </div>
    <button id="startBtn" class="btn primary">
      Start Call Assistance
    </button>
    <button id="languageBtn" class="btn">
      Language Options
    </button>
    <button id="settingsBtn" class="btn">
      Settings
    </button>
    <button id="tutorialBtn" class="btn">
      Tutorial
    </button>
    <div class="keyboard-controls">
      <h3>Keyboard Controls</h3>
      <p><strong>Arrow keys</strong> to navigate</p>
      <p><strong>ENTER</strong> to select option</p>
      <p><strong>ESC</strong> to go back</p>
      <p><strong>CTRL+TAB</strong> to toggle panel</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
