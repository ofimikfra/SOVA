<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVA Menu</title>
    <script>
  document.querySelector('.primary').onclick = () => {
    fetch('http://127.0.0.1:5000/start')
      .then(response => response.json())
      .then(data => {
        console.log("Python script triggered!");
        alert("SOVA Assistance Starting...");
      })
      .catch(err => alert("Make sure your Python server is running!"));
  };
    </script>
</head>
<body>

    <div class="menu-container">
        <img src="logo.png" alt="Sova Logo"  class="logo">

        <h1>SOVA</h1>

        <div class="button-stack">
            <button class="btn">Start Call Assistance</button>
            <button class="btn">Language Options</button>
            <button class="btn">Settings</button>
            <button class="btn">Tutorial</button>
        </div>
    </div>
    <div class="button-group">
        <button id="start-btn" class="btn primary">Start SOVA</button>
        <button id="toggle-btn" class="btn secondary">Toggle Dashboard</button>
    </div>

    <script>
        // Manual Toggle for the UI
        document.getElementById('toggle-btn').addEventListener('click', () => {
            fetch('http://127.0.0.1:5000/manual_toggle');
        });

        // Existing Start Code
        document.getElementById('start-btn').addEventListener('click', () => {
            fetch('http://127.0.0.1:5000/start');
         });
    </script>

</body>
</html>
